<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Analítica360</title>
    <link rel="icon" type="image/png" href="/assets/icono.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0a192f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .contenido { max-width: 500px; }
        .codigo {
            font-family: 'Montserrat', sans-serif;
            font-size: 7rem;
            font-weight: 800;
            color: #29C7F6;
            line-height: 1;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        p {
            color: rgba(255,255,255,0.6);
            margin-bottom: 35px;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            background-color: #29C7F6;
            color: #003B73;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="contenido">
        <div class="codigo">404</div>
        <h1>Página no encontrada</h1>
        <p>La página que busca no existe o fue movida. Regrese al inicio y continúe explorando.</p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
